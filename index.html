<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F1E8">
<title>이태원 맨션</title>
<style>
:root{
  --paper:#F4F1E8; --ink:#26241F; --ink2:#5F5B4E; --ink3:#A29C88;
  --green:#6E8B74; --green-d:#41543F; --card:#EAE6D9; --line:#D6D1BF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  overscroll-behavior:none;}
body{min-height:100vh;min-height:100dvh;}
#app{max-width:520px;margin:0 auto;padding:0 0 28px;}
.serif{font-family:"Apple SD Gothic Neo",Georgia,"Noto Serif KR",serif}

/* 기운 초록 띠 */
#band{position:sticky;top:0;z-index:20;background:var(--paper);padding:10px 0 6px;}
#bandIn{background:var(--green);color:var(--paper);display:flex;justify-content:space-between;
  align-items:center;padding:7px 16px;font-size:12px;transform-origin:center;
  transform:rotate(-1.5deg) scale(1.06);transition:transform .8s ease, filter .8s ease;}
#bandIn b{font-weight:600;font-size:13px;transition:font-size .5s}
.wrap{padding:0 20px}

h1{font-size:30px;font-weight:600;letter-spacing:-.5px;margin:38px 0 6px}
p{line-height:1.75;margin:0 0 14px}
.small{font-size:12.5px;color:var(--ink3);line-height:1.6}
.mid{font-size:13.5px;color:var(--ink2);line-height:1.7}

button{font-family:inherit;cursor:pointer}
.btn{display:block;width:100%;background:var(--green);color:var(--paper);border:0;
  border-radius:10px;padding:15px;font-size:16px;font-weight:500;margin:10px 0}
.btn.ghost{background:transparent;color:var(--green-d);border:1px solid var(--line)}
.btn.sm{padding:11px;font-size:14px}

/* 대사/회상 */
.npc{display:flex;align-items:center;gap:10px;margin:14px 0 12px}
.chip{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--green);
  background:var(--card);color:var(--green-d);display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:600}
.npcname{font-size:12px;color:var(--ink3)}
.say{font-size:15.5px;line-height:1.8;margin:0 0 20px;white-space:pre-line}
.recall{font-size:16px;line-height:1.95;margin:26px 0;white-space:pre-line}
.see{font-size:17px;line-height:1.9;margin:70px 0 60px;text-align:center;white-space:pre-line}
.tapHint{text-align:center;font-size:12px;color:var(--ink3);margin:26px 0 10px}

/* 선택지 */
.ch{display:block;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:9px 0;color:var(--ink)}
.ch.big{font-size:18px;font-weight:600;line-height:1.5;border-color:#B8B29E}
.ch.mid{font-size:15px;line-height:1.6;color:#3A382F}
.ch.small{font-size:13.5px;line-height:1.7;opacity:.65}
.ch:active{background:var(--card)}

/* 걷기 */
.lm{height:96px;border-radius:10px;background:#DDD8C8;display:flex;align-items:center;
  justify-content:center;color:#8A8574;font-size:12px;margin:14px 0 12px;overflow:hidden}
.lm img{width:100%;height:100%;object-fit:cover}
.guide{font-size:15px;line-height:1.75;margin:0 0 16px}
#dist{text-align:center;font-size:13px;color:var(--ink2);margin:8px 0 4px}
#dist b{font-size:22px;font-weight:600;color:var(--ink)}
#acc{text-align:center;font-size:11px;color:var(--ink3);margin-bottom:14px}
.toast{background:var(--card);border-radius:10px;padding:12px 14px;font-size:12.5px;
  line-height:1.6;color:var(--green-d);margin:12px 0}
.toast b{font-weight:600}

/* survey */
.srow{display:flex;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.srow button{flex:0 0 auto;background:var(--green);color:#fff;border:0;border-radius:8px;padding:9px 12px;font-size:13px}
.srow span{flex:1;color:var(--ink2);font-size:12px}
textarea{width:100%;height:150px;font-family:ui-monospace,Menlo,monospace;font-size:11px;
  border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:#222}
.fade{animation:f .45s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="band"><div id="bandIn"><span>재개발 <b id="bR">62%</b></span><span style="opacity:.8;font-size:11px">이태원 맨션</span><span><b id="bV">3.2억</b></span></div></div>
<div id="app"><div class="wrap" id="scr"></div></div>

<script>
/* ============================================================
   1) 좌표 — ?survey=1 로 현장에서 수집한 값을 여기 붙여넣으세요
   ============================================================ */
var SPOTS = [
  {id:0, name:"시작지점",     lat:37.53480, lng:126.99430, r:30},
  {id:1, name:"정면 자리",     lat:37.53470, lng:126.99330, r:30},
  {id:2, name:"왼쪽 골목",     lat:37.53455, lng:126.99230, r:30},
  {id:3, name:"뒷길",         lat:37.53560, lng:126.99360, r:30},
  {id:4, name:"남쪽 오르막",   lat:37.53390, lng:126.99390, r:30},
  {id:5, name:"주차장",       lat:37.53500, lng:126.99320, r:25}
];
var SAVED = localStorage.getItem('im_spots');
if(SAVED){ try{ SPOTS = JSON.parse(SAVED); }catch(e){} }

/* ============================================================
   2) 스토리 — 대사·수치 전부 여기서 수정
   ============================================================ */
var WALK = [
 {to:1, txt:"회나무로13나길을 따라 서쪽으로 걸으세요.\n왼쪽에 숲 놀이터가 나타나면, 그 입구쯤에서 멈추세요.\n길 건너에 그 집이 있습니다.", img:""},
 {to:2, txt:"집을 등지고 골목을 따라 더 내려가세요.\n골목 끝이 넓어지는 곳까지.", img:""},
 {to:3, txt:"왔던 골목을 그대로 되짚어 오르세요.\n서두르지 마세요. 숨이 조금 차야 맞습니다.\n집을 지나, 모퉁이에서 왼쪽 오르막으로.", img:"",
  mid:"나는 이 골목으로 30년을 올라 다녔다. 숨이 찼다. 매일 찼다.\n\n그래도 나는 늘 생각했다 — 우리 집은 평지에 있다고. 언덕은 골목이지, 집이 아니라고.\n\n경사는 남의 집 사정이고, 내 집은 반듯하다고. …숨이 찬 건, 내가 늙어서라고."},
 {to:4, txt:"내리막을 따라 내려가세요.\n처음 만났던 자리를 지나, 계속.\n길이 가팔라지기 시작하면 거의 다 온 겁니다.", img:""},
 {to:5, txt:"집을 향해 다시 올라가세요.\n이번에는 지나치지 말고 — 건물 옆, 주차장으로 들어가세요.\n처음으로, 집에 닿는 거리입니다.", img:""}
];

var S = [
{ /* 0 */ spot:0, name:"공인중개사", ini:"중", see:"", recall:[],
  beats:[
   {say:'"김 사장님, 마침 잘 오셨어. 앉아 봐요. …조합에서 다녀갔어요. 동의율 62%래.\n75% 되면 끝이에요. 사장님이 뭐라든 골목이 통째로 넘어가. 사장님네하고 두어 집 남았어요.\n근데 사장님, 버티기만 하면 되는 게 아닌 거는… 아시죠?"',
    ch:[["버티면 되지. 30년 버텼는데 뭘 새삼.","big",1,0,0],
        ["알아. 그러니까 골치지.","mid",0,0,0],
        ["…모르겠네. 뭘 어째야 되는 건지, 사실은.","small",0,0,1]],
    re:['"그 버티기가 문제라니까. 사장님이 버틸수록 조합은 사장님네를 값으로 조여요."',
        '"골치죠. 이게 이러지도 저러지도 못하는 판이에요."',
        '"……. 그 말 들으니까 오히려 내가 설명을 해야겠네."']},
   {say:'"은행에서도 왔다 갔어요. 재감정 한다고. 지금 시세로 3억 2천인데,\n사장님 대출이 1억 8천이잖아. 감정가가 그 밑으로 꺼지면 — 은행이 집을 가져가요.\n\n그러니까 이 판이 웃긴 거예요. 재개발 막으려고 집 흉을 보면 값이 꺼지고,\n값 지키려고 집 자랑을 하면 조합이 사업성 있다고 달려들고.\n사장님 입이 오늘 사장님 집값이에요. 뭐라고 말하고 다닐 거예요?"',
    ch:[["자랑할 거야. 제일 넓은 집이라고. 사실이니까.","big",2,2,0],
        ["흉볼 거야. 물 새고 금 간 집이라고. 그것도 사실이니까.","mid",-2,-2,0],
        ["…둘 다 사실인 게 문제구먼.","small",0,-1,1]],
    re:['"그러다 조합 좋은 일만 시켜요. 뭐, 사장님 집이니까."',
        '"그 말, 은행 귀에도 들어가는 거 아시고 하는 말이죠?"',
        '"……맞아요. 그게 이 골목 문제를 한 줄로 줄인 거예요."']},
   {say:'"가 봐요. 아, 그리고… 사장님, 내 장부에 그 집 뭐라고 적혀 있는지 알아요?\n주소가 아니에요. 손님들이 부르는 이름이 따로 있어.\n…아니, 오늘은 말 안 할래. 골목 돌다 보면, 어차피 듣게 될 거예요."', ch:[], re:[]}
  ],
  echo:"중개사가 창 너머로 당신을 본다."},

{ /* 1 */ spot:1, name:"최고령 주민", ini:"주",
  see:"길 건너에서 1층을 보세요.\n언덕에 눌려서, 반쯤 파묻혀 있습니다.\n\n— 저 1층이, 등기부상 이 골목에서 제일 넓습니다.\n그렇게 보입니까?",
  recall:["경사지에서 평수를 뽑으려면 건물이 언덕 아래로 몸을 내밀어야 했다.\n그래서 1층은 반은 길 위에, 반은 길 아래에 있다.",
          "등기부에는 내가 이겼다고 적혀 있다. 골목에서 제일 넓다고.\n근데 겉에서 보면 — 제일 좁아 보이는 게 저 1층이다.",
          "저 초록 띠, 길을 따라 기울어 보이지.\n집이 기운 게 아니다. 길이 기운 거다.\n나는 30년째 그렇게 말한다."],
  beats:[
   {say:'"김씨 아니야. …나 자네 옛날에 다 봤어. 옆집 담벼락 새벽마다 쓸어보고 다니던 거.\n자네 색시가 좁게 짓자던 것도 들었고. — 넓은 게 무슨 소용이야, 사람이 들어야 집이지, 그러던 거.\n\n근데 김씨. 저 1층 말이야. 넓다며. 넓다는 집이 왜 저렇게 웅크리고 있어?"',
    ch:[["웅크리긴. 등기부 떼봐. 이 골목서 제일 넓어. 종이가 증명해.","big",3,2,0],
        ["언덕이 저래서 그래. 이 땅에 지은 게 잘못이지.","mid",-1,-2,0],
        ["…파묻힌 게 아니라 버티고 선 건데. 그게 잘 안 보이지, 남들 눈엔.","small",1,0,1]],
    re:['"종이가 증명하면 뭐 해, 아무도 종이를 안 보는데. 다들 눈으로 보지."',
        '"땅 탓을 다 하네. 그 땅 사던 날 자네 얼굴이 얼마나 훤했는데."',
        '"……버틴다. 그 말은 맞네. 30년 버텼지, 저 집도 자네도."']},
   {say:'"저 초록 칠 말이야. 색시가 고른 색이라며. 빨갛게 바꿨다가 도로 초록 됐지.\n근데 저 띠가 삐뚜름한 거는 알아? 길 따라 칠해놔서, 멀리서 보면 집이 기운 것 같아.\n수평으로 칠하지 그랬어. 그럼 반듯해 보였을 거 아니야."',
    ch:[["집은 반듯해. 기운 건 길이야. 내가 왜 길한테 맞춰.","big",2,1,0],
        ["이제 와서 뭘 반듯하게 해. 다 삐뚜름한 집인데.","mid",0,-2,0],
        ["…수평으로 칠하면, 길이랑 어긋나 보여. 해봤어, 한 번. 그래서 도로 길 따라 칠했어.","small",0,0,1]],
    re:['"하이고, 길이 기울었대. 자네다운 말이네. 30년째 자네다워."',
        '"그런 말 말어. 집 듣겠네."',
        '"……해봤구나, 수평으로. 나는 자네가 고집만 부린 줄 알았지."']},
   {say:'"가봐. 골목 좁아서, 자네 말은 자네보다 빨리 돌아."', ch:[], re:[]}
  ],
  echo:"자랑이 부풀어 먼저 도착했다."},

{ /* 2 */ spot:2, name:"마지막 세입자", ini:"세",
  see:"골목 끝에서 집의 왼쪽 얼굴을 보세요.\n1층 유리 안에 커튼이 쳐져 있습니다.\n\n비어 있습니다. 몇 달째.",
  recall:["첫 세입자는 봉제 부업집이었다. 공장 접고 얻은 땅에서 다시 재봉틀 소리가 났다.\n나는 그 소리가 좋아서 1층에 자주 내려갔다.",
          "그 다음이 만화방, 치킨집, 카페.\n나갈 때마다 나는 페인트만 새로 칠했다. 초록, 빨강, 다시 초록.",
          "마지막 사람이 나간 게 올봄이다.\n그 뒤로 저 1층은 — 골목에서 제일 넓게, 비어 있다."],
  beats:[
   {say:'"어, 사장님. …우편물 가지러 왔어요. 아직 가게 앞으로 오는 게 있어서.\n새 자리는 아랫동네에 얻었어요. 좁아도 물은 안 새요. …그 말 하려던 건 아닌데. 죄송해요.\n\n사장님, 저 나간 거 서운하셨죠."',
    ch:[["서운은. 자네 나가고 바로 보러 온 사람 셋이야. 곧 새로 들어와.","big",1,2,0],
        ["잘 나갔어. 그 1층, 오래 못 버텨. 자네라도 산 거야.","mid",1,-2,0],
        ["…서운했지. 재봉틀 소리 닮은 게 자네 미싱이었는데.","small",0,0,1]],
    re:['"……셋이나요. (커튼 쳐진 유리를 본다) …네. 잘됐네요."',
        '"사장님이 그런 말씀을 하시니까 이상하네요. 그 건물, 사장님 자랑이었잖아요."',
        '"……저도 그 소리 좋아했어요. 사장님 내려와서 한참 서 계시던 것도 알고요."']},
   {say:'"저기, 이 말은 하고 갈게요. 물 새던 자리 있잖아요. 20년 내내 같은 자리요.\n저 이제 양동이 어디 놓는지도 안 까먹어요. 몸이 기억해요.\n\n…근데 사장님. 월세 20년 안 올리신 거. 그거 미안해서 그러신 거죠. 물 때문에.\n저 그거 알고도 모른 척했어요. 사장님이 모른 척하시니까."',
    ch:[["미안은 무슨. 귀찮아서 안 올린 거야. 계산이 귀찮잖아.","big",0,1,0],
        ["그 물 때문에 자네도 나간 거잖아. 이 집은 그런 집이야.","mid",1,-2,0],
        ["…미안했네. 20년 내내. 말이 그렇게 안 나오더구먼.","small",0,-1,1]],
    re:['"(웃는다) …네. 귀찮으셨겠죠. 20년 동안, 매달, 꼬박꼬박 귀찮으셨겠죠."',
        '"물 때문 아니에요. 저는… 아니에요, 이 얘긴 그만할게요."',
        '"……알아요. 알았어요, 저는. (우편물을 고쳐 안는다) 사장님, 건물은 죄가 없어요."']},
   {say:'"가보세요. 늘 다니시던 골목으로.\n…사장님, 근데 그 골목 오르막인 건 아세요?"', ch:[], re:[]}
  ],
  echo:"빈 1층 얘기가 골목을 돌았다."},

{ /* 3 */ spot:3, name:"재개발 추진위원", ini:"추",
  see:"이제 내려가면서, 집의 뒷모습을 보세요.\n\n— 어떻습니까. 그냥, 멀쩡한 빌라죠.",
  recall:["손님이 오면 나는 꼭 이 뒷길로 안내했다.\n이쪽에서 보면 우리 집은 아무 문제가 없다.",
          "위는 멀쩡한 빌라다. 진짜다.\n문제는 이 각도에서 안 보일 뿐이다.",

   3) 상태

var G = {R:62, V:32, sok:0, sign:false, log:[], phase:"title", si:0, bi:0, ri:0, wi:0, done:[]};
var GHOST = location.search.indexOf('ghost=1')>-1;
var SURVEY = location.search.indexOf('survey=1')>-1;
var pos=null, watchId=null, arrivedT=0, walkStart=0, midShown=false;
var scr = document.getElementById('scr');

function save(){ try{localStorage.setItem('im_save', JSON.stringify(G));}catch(e){} }
function load(){ try{var s=localStorage.getItem('im_save'); if(s) return JSON.parse(s);}catch(e){} return null; }

function band(){
  document.getElementById('bR').textContent = G.R+'%';
  document.getElementById('bV').textContent = (G.V/10).toFixed(1)+'억';
  var deg = -1.5 - Math.max(0,(G.R-62))*0.22;
  var pale = G.V<=24 ? (1-(G.V-18)/10)*0.5 : 0;
  var bi = document.getElementById('bandIn');
  bi.style.transform = 'rotate('+deg.toFixed(2)+'deg) scale(1.06)';
  bi.style.filter = 'saturate('+(1-pale).toFixed(2)+')';
  var big = 13 + Math.max(0, G.R-62)*0.25;
  document.getElementById('bR').style.fontSize = big+'px';
}

/* ============================================================
   4) GPS
   ============================================================ */
function startGPS(){
  if(!navigator.geolocation) return;
  if(watchId!==null) return;
  watchId = navigator.geolocation.watchPosition(function(p){
    pos = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy};
    if(G.phase==='walk') tickWalk();
    if(SURVEY) drawSurvey();
  }, function(e){}, {enableHighAccuracy:true, maximumAge:2000, timeout:15000});
}
function dist(a,b){
  var R=6371000, t1=a.lat*Math.PI/180, t2=b.lat*Math.PI/180;
  var dt=(b.lat-a.lat)*Math.PI/180, dl=(b.lng-a.lng)*Math.PI/180;
  var x=Math.sin(dt/2)*Math.sin(dt/2)+Math.cos(t1)*Math.cos(t2)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function wake(){ if('wakeLock' in navigator){ navigator.wakeLock.request('screen').catch(function(){}); } }

   5) 화면
   ============================================================ */

  html('<h1>이태원 맨션</h1>'+

   '<button class="btn" id="go">걷기 시작</button>'+

  G.phase='intro';

   '<p class="recall serif">옆집은 목수 영감이 지은 집이라 마감이 자로 잰 듯했다.\n나는 그 집 앞을 지날 때마다 담벼락을 손으로 쓸어보고 갔다.</p>'+
   '<p class="recall serif">그래서 딱 하나만 고집했다.\n1층은 무조건 옆집보다 넓게.</p>'+
   '<p class="recall serif">시공하던 사람이 그랬다. 사장님, 이러면 아래 마감이 안 삽니다.\n내가 그랬다.\n\n마감은 나중에 고치면 되는데, 평수는 못 고쳐.</p>'+
   '<p class="recall serif" style="text-align:center;margin-top:50px">지금부터 당신은 김씨입니다.</p>'+
   '<button class="btn" id="n">중개사무소로</button>');

/* 세션 진행: see → recall(n) → beat(say→choice→react) → walk */
function route(){
  band();
  if(G.phase==='see') return scrSee();
  if(G.phase==='recall') return scrRecall();
  if(G.phase==='beat') return scrBeat();
  if(G.phase==='react') return scrReact();
  if(G.phase==='walk') return scrWalk();
  if(G.phase==='arrive') return scrArrive();
  if(G.phase==='ending') return scrEnding();
  scrTitle();
}

function scrSee(){
  var s=S[G.si];
  if(!s.see){ G.phase='recall'; G.ri=0; return route(); }
  html('<p class="see serif">'+s.see+'</p><p class="tapHint">화면을 누르면 계속됩니다</p>');
  scr.onclick=function(){ scr.onclick=null; G.phase='recall'; G.ri=0; save(); route(); };
}
function scrRecall(){
  var s=S[G.si];
  if(G.ri>=s.recall.length){ G.phase='beat'; G.bi=0; return route(); }
  html('<p class="recall serif">'+s.recall[G.ri]+'</p><p class="tapHint">화면을 누르면 계속됩니다</p>');
  scr.onclick=function(){ scr.onclick=null; G.ri++; save(); route(); };
}
function scrBeat(){
  var s=S[G.si], b=s.beats[G.bi];
  if(!b){ return toWalk(); }
  var h='<div class="npc"><div class="chip">'+s.ini+'</div><div class="npcname">'+s.name+'</div></div>';
  h+='<p class="say">'+b.say+'</p>';
  if(b.ch.length===0){
    h+='<button class="btn" id="n">'+(G.si===5?'그리고':'다음으로')+'</button>';
    html(h);
    document.getElementById('n').onclick=function(){ G.bi++; save(); route(); };
    return;
  }
  for(var i=0;i<b.ch.length;i++){
    h+='<button class="ch '+b.ch[i][1]+'" data-i="'+i+'">'+b.ch[i][0]+'</button>';
  }
  html(h);
  var bs=scr.querySelectorAll('.ch');
  for(var j=0;j<bs.length;j++) bs[j].onclick=function(){ pick(parseInt(this.getAttribute('data-i'))); };
}
function pick(i){
  var s=S[G.si], b=s.beats[G.bi], c=b.ch[i];
  G.pR=(G.pR||0)+c[2]; G.pV=(G.pV||0)+c[3]; G.sok+=c[4];
  if(c[5]==='sign') G.sign=true;
  G.log.push(c[0]);
  G.lastPick=i; G.phase='react'; save(); route();
}
function scrReact(){
  var s=S[G.si], b=s.beats[G.bi];
  var h='<div class="npc"><div class="chip">'+s.ini+'</div><div class="npcname">'+s.name+'</div></div>';
  h+='<p class="say">'+b.re[G.lastPick]+'</p>';
  h+='<button class="btn" id="n">'+(G.si===5&&G.bi===1?'…':'다음으로')+'</button>';
  html(h);
  document.getElementById('n').onclick=function(){ G.bi++; G.phase='beat'; save(); route(); };
}

function toWalk(){
  G.R=Math.max(0,Math.min(100,G.R+(G.pR||0)));
  G.V=Math.max(0,Math.min(100,G.V+(G.pV||0)));
  G.dR=(G.pR||0); G.dV=(G.pV||0); G.pR=0; G.pV=0;
  G.done.push(G.si);
  if(G.si>=5){ G.phase='ending'; save(); return route(); }
  G.wi=G.si; G.si++; G.phase='walk'; walkStart=Date.now(); arrivedT=0; midShown=false;
  save(); band(); route();
}

function scrWalk(){
  var w=WALK[G.wi], sp=SPOTS[w.to];
  var h='';
  h+='<div class="lm">'+(w.img?'<img src="'+w.img+'">':'다음 지점 · '+sp.name)+'</div>';
  h+='<p class="guide serif">'+w.txt+'</p>';
  h+='<div id="mapbox"></div>';
  h+='<div id="dist">남은 거리 <b>--</b></div><div id="acc"></div>';
  h+='<div class="toast" id="toast">그 말이 돌았다 — 재개발 <b>'+(G.dR>=0?'+':'')+G.dR+'</b> · 집값 <b>'+(G.dV>=0?'+':'')+(G.dV/10).toFixed(1)+'억</b><br>'+(S[G.wi].echo||'')+'</div>';
  h+='<div id="arrivebox"></div>';
  html(h);
  drawMap();
  tickWalk();
}

function drawMap(){
  var box=document.getElementById('mapbox'); if(!box) return;
  var w=WALK[G.wi], target=SPOTS[w.to], from=SPOTS[SPOTS[w.to].id-1]||SPOTS[0];
  var pts=[from,target]; if(pos) pts.push(pos);
  var minLa=1e9,maxLa=-1e9,minLo=1e9,maxLo=-1e9;
  for(var i=0;i<pts.length;i++){ minLa=Math.min(minLa,pts[i].lat);maxLa=Math.max(maxLa,pts[i].lat);
    minLo=Math.min(minLo,pts[i].lng);maxLo=Math.max(maxLo,pts[i].lng); }
  var pad=0.0004; minLa-=pad;maxLa+=pad;minLo-=pad;maxLo+=pad;
  var W=280,H=150;
  function px(p){ return {x:((p.lng-minLo)/(maxLo-minLo))*W, y:H-((p.lat-minLa)/(maxLa-minLa))*H}; }
  var a=px(from), b=px(target);
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  s+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="#C9C3B0" stroke-width="6" stroke-linecap="round"/>';
  s+='<circle cx="'+b.x+'" cy="'+b.y+'" r="11" fill="none" stroke="#41543F" stroke-width="1.4" stroke-dasharray="3 3"/>';
  s+='<text x="'+b.x+'" y="'+(b.y+4)+'" text-anchor="middle" font-size="11" fill="#41543F">'+target.id+'</text>';
  if(pos){ var p=px(pos);
    s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="9" fill="#6E8B74" opacity=".25"/>';
    s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="5" fill="#41543F"/>'; }
  s+='</svg>';
  box.innerHTML=s;
}

function tickWalk(){
  if(G.phase!=='walk') return;
  var w=WALK[G.wi], sp=SPOTS[w.to];
  var d = pos ? dist(pos,sp) : null;
  var de=document.getElementById('dist'), ae=document.getElementById('acc');
  if(!de) return;
  if(d!==null){
    de.innerHTML='남은 거리 <b>'+(Math.round(d/10)*10)+'m</b>';
    ae.textContent='GPS 오차 약 '+Math.round(pos.acc)+'m';
    drawMap();
    if(d<=sp.r){ return arriveNow(); }
  } else {
    de.innerHTML='<b style="font-size:14px">위치를 찾는 중…</b>';
    ae.textContent = GHOST?'유령 모드':'하늘이 트인 곳에서 더 잘 잡힙니다';
  }
  var el=Date.now()-walkStart;
  if(w.mid && !midShown && el>50000){ midShown=true; showMid(w.mid); return; }
  var ab=document.getElementById('arrivebox');
  if(ab && !ab.innerHTML && (el>40000 || GHOST)){
    ab.innerHTML='<button class="btn ghost sm" id="bk">여기 도착했습니다</button>';
    document.getElementById('bk').onclick=arriveNow;
  }
  setTimeout(tickWalk, 1200);
}
function showMid(txt){
  html('<p class="recall serif">'+txt+'</p><p class="tapHint">화면을 누르면 계속 걷습니다</p>');
  scr.onclick=function(){ scr.onclick=null; scrWalk(); };
}
function arriveNow(){
  if(G.phase!=='walk') return;
  G.phase='arrive'; save(); route();
}
function scrArrive(){
  var sp=SPOTS[WALK[G.wi].to];
  html('<p class="see serif">'+sp.name+'에 도착했습니다.</p><button class="btn" id="n">멈춰 서기</button>');
  document.getElementById('n').onclick=function(){ G.phase='see'; G.bi=0; G.ri=0; save(); route(); };
}

function scrEnding(){
  var key;
  if(G.V<=18) key = G.sok>=4?'B2':'B1';
  else if(G.sign || G.R>=75) key = G.sok>=4?'A2':'A1';
  else key = G.sok>=4?'C2':'C1';
  var e=ENDINGS[key];
  var h='<p class="small" style="margin-top:30px">오늘 당신이 한 말</p>';
  for(var i=0;i<G.log.length;i++) h+='<p class="mid" style="margin:6px 0">— '+G.log[i]+'</p>';
  h+='<p class="mid" style="margin-top:18px">중개인이 말한다. "오늘 김 사장님, '+G.log.length+'번 말했어요. 그중 '+G.sok+'번은… 뭐, 들으셨잖아요."</p>';
  h+='<h1 style="margin-top:40px">'+e.t+'</h1>';
  h+='<p class="recall serif">'+e.b+'</p>';
  h+='<p class="mid">'+e.g+'<br>'+e.l+'</p>';
  h+='<p class="mid" style="margin-top:20px">재개발 '+G.R+'% · 집값 '+(G.V/10).toFixed(1)+'억</p>';
  h+='<p class="see serif" style="margin:60px 0 40px">이 이야기는 지어낸 것입니다.\n그런데 저 초록 띠는,\n정말 길을 따라 기울어 있습니다.</p>';
  h+='<button class="btn ghost" id="again">다시 걷는다</button>';
  html(h);
  localStorage.removeItem('im_save');
  document.getElementById('again').onclick=function(){ G={R:62,V:32,sok:0,sign:false,log:[],phase:'title',si:0,bi:0,ri:0,wi:0,done:[]}; band(); scrTitle(); };
}

/* ============================================================
   6) 좌표 수집 모드
   ============================================================ */
function drawSurvey(){
  if(!SURVEY) return;
  var st=JSON.parse(localStorage.getItem('im_survey')||'{}');
  var h='<h1 style="font-size:22px">좌표 수집</h1>';
  h+='<p class="mid">각 지점에 서서 버튼을 누르세요.<br>GPS 오차가 10m 아래로 내려갔을 때 누르면 좋습니다.</p>';
  h+='<p class="mid" id="now">'+(pos?('현재 '+pos.lat.toFixed(6)+', '+pos.lng.toFixed(6)+' · 오차 '+Math.round(pos.acc)+'m'):'위치를 찾는 중…')+'</p>';
  for(var i=0;i<SPOTS.length;i++){
    var s=st[i];
    h+='<div class="srow"><button data-i="'+i+'">'+i+'. '+SPOTS[i].name+'</button>'+
       '<span>'+(s?(s.lat.toFixed(6)+', '+s.lng.toFixed(6)+' ('+Math.round(s.acc)+'m)'):'미수집')+'</span></div>';
  }
  h+='<p class="small" style="margin-top:16px">아래 코드를 복사해서 index.html의 SPOTS 자리에 붙여넣으세요.</p>';
  var code='var SPOTS = [\n';
  for(var j=0;j<SPOTS.length;j++){ var q=st[j];
    code+='  {id:'+j+', name:"'+SPOTS[j].name+'", lat:'+(q?q.lat.toFixed(6):SPOTS[j].lat)+', lng:'+(q?q.lng.toFixed(6):SPOTS[j].lng)+', r:'+SPOTS[j].r+'}'+(j<SPOTS.length-1?',':'')+'\n'; }
  code+='];';
  h+='<textarea id="code" readonly>'+code+'</textarea>';
  h+='<button class="btn sm" id="cp">코드 복사</button>';
  h+='<button class="btn ghost sm" id="apply">이 좌표로 바로 플레이</button>';
  h+='<p class="small" style="margin-top:22px">현장에 못 갔을 때 — 지금 있는 곳 주변에 지점 6개를 임시로 흩어놓고 걸어서 테스트합니다. (구간당 60~120m, 반경 20m)</p>';
  h+='<button class="btn sm" id="mock">여기 기준으로 테스트 코스 만들기</button>';
  h+='<button class="btn ghost sm" id="clr">수집 초기화</button>';
  html(h);
  var bs=scr.querySelectorAll('.srow button');
  for(var k=0;k<bs.length;k++) bs[k].onclick=function(){
    if(!pos){ alert('아직 위치를 못 잡았습니다'); return; }
    var st2=JSON.parse(localStorage.getItem('im_survey')||'{}');
    st2[this.getAttribute('data-i')]={lat:pos.lat,lng:pos.lng,acc:pos.acc};
    localStorage.setItem('im_survey',JSON.stringify(st2)); drawSurvey();
  };
  document.getElementById('cp').onclick=function(){
    var t=document.getElementById('code'); t.select(); t.setSelectionRange(0,99999);
    try{document.execCommand('copy');}catch(e){}
    if(navigator.clipboard) navigator.clipboard.writeText(t.value);
    this.textContent='복사됨';
  };
  document.getElementById('apply').onclick=function(){
    var st3=JSON.parse(localStorage.getItem('im_survey')||'{}');
    for(var m=0;m<SPOTS.length;m++){ if(st3[m]){ SPOTS[m].lat=st3[m].lat; SPOTS[m].lng=st3[m].lng; } }
    localStorage.setItem('im_spots', JSON.stringify(SPOTS));
    location.href = location.pathname;
  };
  document.getElementById('mock').onclick=function(){
    if(!pos){ alert('아직 위치를 못 잡았습니다. 하늘이 트인 곳에서 잠시 기다려 주세요.'); return; }
    var mLat=1/111320, mLng=1/(111320*Math.cos(pos.lat*Math.PI/180));
    var off=[[0,0],[0,-90],[0,-190],[110,-120],[-120,-60],[40,-140]];
    for(var i=0;i<6;i++){
      SPOTS[i].lat = pos.lat + off[i][0]*mLat;
      SPOTS[i].lng = pos.lng + off[i][1]*mLng;
      SPOTS[i].r = 20;
    }
    localStorage.setItem('im_spots', JSON.stringify(SPOTS));
    localStorage.removeItem('im_save');
    location.href = location.pathname;
  };
  document.getElementById('clr').onclick=function(){ localStorage.removeItem('im_survey'); localStorage.removeItem('im_spots'); drawSurvey(); };
}

/* ============================================================
   7) 시작
   ============================================================ */
band();
if(SURVEY){ startGPS(); drawSurvey(); }
else { scrTitle(); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden) wake(); });
</script>
</body>
</html>
