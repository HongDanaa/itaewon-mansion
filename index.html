<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F0EADB">
<title>이태원 맨션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F0EADB; --ink:#2B2721; --ink2:#8A8071; --ink3:#A79F8E;
  --green:#5F7F66; --green-d:#41543F; --card:#E6DFCC; --line:#CDC4B0;
  --seal:#9C3A2C; --night:#211E19;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-serif:"Gowun Batang","Apple SD Gothic Neo",serif;
  --f-mono:"Nanum Gothic Coding",ui-monospace,Menlo,monospace;
  --f-hand:"Nanum Pen Script","Gowun Dodum",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-body); overscroll-behavior:none;}
body{min-height:100vh;min-height:100dvh;}

/* ===== 패턴지: 방안 격자 ===== */
#app{max-width:520px;margin:0 auto;padding:0 0 28px;min-height:100dvh;
  transition:background-color .5s ease;
  background-image:
    linear-gradient(to right, rgba(43,39,33,.042) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(43,39,33,.042) 1px, transparent 1px);
  background-size:26px 26px;}
body.night #app{background-image:none}

.serif{font-family:var(--f-serif)}
.wrap{padding:0 20px;min-height:78dvh}
h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:38px 0 6px;font-family:var(--f-serif)}
p{line-height:1.75;margin:0 0 14px}
.small{font-size:12.5px;color:var(--ink3);line-height:1.6}
.mid{font-size:13.5px;color:var(--ink2);line-height:1.7}
button{font-family:inherit;cursor:pointer}

/* ===== 줄자 게이지 ===== */
#band{position:sticky;top:0;z-index:20;background:var(--paper);padding:10px 0 6px;
  transition:opacity .7s ease, max-height .7s ease, padding .7s ease, background-color .5s ease;}
#band.hidden{opacity:0;max-height:0;padding:0;overflow:hidden;pointer-events:none}
#bandIn{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 16px 15px;font-family:var(--f-mono);font-size:12px;
  color:var(--ink);background-color:var(--card);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background-image:
    repeating-linear-gradient(90deg, var(--green) 0 14px, transparent 14px 25px),
    repeating-linear-gradient(90deg, var(--ink2) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 45px);
  background-size:100% 3px, 100% 5px, 100% 9px;
  background-position:bottom left, top left, top left;
  background-repeat:repeat-x;
  transform-origin:center;
  transform:rotate(0deg) scale(1.02);
  transition:transform .9s ease, filter .8s ease;}
#bandIn b{font-weight:700;font-size:15px;transition:font-size .5s}

/* ===== 대화 ===== */
.npc{display:flex;align-items:center;gap:10px;margin:14px 0 12px}
.chip{position:relative;flex:0 0 auto;width:38px;height:38px;border-radius:2px;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-size:13px;overflow:hidden}
.chip img{width:100%;height:100%;object-fit:cover;display:block}
.chip.noimg::after{content:attr(data-i)}
.npcname{font-size:10.5px;letter-spacing:.3em;font-family:var(--f-mono);
  color:var(--paper);background:var(--ink2);padding:4px 9px;transform:rotate(-.5deg)}
.say{font-size:15.5px;line-height:1.85;margin:0 0 20px;white-space:pre-line}
.recall{font-size:16px;line-height:1.95;margin:26px 0;white-space:pre-line}
.see{font-size:17px;line-height:1.9;margin:70px 0 60px;text-align:center;white-space:pre-line}
.tapHint{text-align:center;font-size:12px;color:var(--ink3);margin:26px 0 10px;
  font-family:var(--f-mono);letter-spacing:.12em}

/* ===== 선택지: 박음질 3결 ===== */
.ch{display:block;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:0;padding:13px 15px;margin:9px 0;color:var(--ink)}
.ch:active{background:var(--card)}
.ch.big{font-size:17.5px;font-weight:700;line-height:1.55;
  border:4px double var(--ink);background:#F6F1E3;
  transform:rotate(-.3deg);}
.ch.mid{font-size:15px;line-height:1.6;color:#3A382F;
  border:1px solid var(--ink);transform:rotate(.25deg);}
.ch.small{width:90%;margin-left:10%;text-align:right;
  font-family:var(--f-hand);font-size:19px;line-height:1.5;
  color:var(--ink2);background:transparent;
  border:2px dashed #B7AF9C;padding:9px 13px 11px;
  transform:rotate(-.5deg);}

/* ===== 걷기 / 도착 ===== */
.btn{display:block;width:100%;background:var(--green);color:var(--paper);border:0;
  border-radius:2px;padding:15px;font-size:16px;font-weight:700;margin:10px 0;
  font-family:var(--f-body);letter-spacing:.04em}
.btn.ghost{background:transparent;color:var(--green-d);border:1px dashed var(--line)}
.btn.sm{padding:11px;font-size:14px}
/* 사진은 원본 비율 그대로. 자르지 않는다 */
.lm{position:relative;display:block;border-radius:2px;background:var(--card);
  border:1px solid var(--line);color:var(--ink3);font-family:var(--f-mono);
  font-size:11px;text-align:center;min-height:46px;line-height:46px;
  margin:14px 0 12px;overflow:hidden}
.lm img{display:block;width:100%;height:auto;max-height:44vh;object-fit:contain;
  filter:saturate(.78) contrast(1.03)}
.lm .lmcap{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;line-height:1.3;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:#F0EADB;
  background:linear-gradient(to top, rgba(33,30,25,.86), rgba(33,30,25,0))}
body.night .lm{border-color:#4A463E;background:#2A2721}
.guide{font-size:15px;line-height:1.8;margin:0 0 16px}
#dist{text-align:center;font-size:13px;color:var(--ink2);margin:8px 0 4px;font-family:var(--f-mono)}
#dist b{font-size:22px;font-weight:700;color:var(--ink)}
#acc{text-align:center;font-size:11px;color:var(--ink3);margin-bottom:14px;font-family:var(--f-mono)}
.toast{background:var(--card);border:1px solid var(--line);border-radius:2px;
  padding:12px 14px;font-size:12.5px;line-height:1.6;color:var(--green-d);margin:12px 0}
.toast b{font-weight:700}
.srow{display:flex;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.srow button{flex:0 0 auto;background:var(--green);color:#fff;border:0;border-radius:2px;
  padding:9px 12px;font-size:13px}
.srow span{flex:1;color:var(--ink2);font-size:12px}
textarea{width:100%;height:150px;font-family:var(--f-mono);font-size:11px;
  border:1px solid var(--line);border-radius:2px;padding:10px;background:#fff;color:#222}

/* ===== 전환 ===== */
.fade{animation:f .55s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
html,body{transition:background-color .5s ease}

/* ===== 밤(공장 어둠) ===== */
body.night{background:var(--night)}
body.night #band{background:var(--night)}
body.night .recall,body.night .see,body.night h1{color:#F0EADB}
body.night .tapHint,body.night .small{color:#8A8071}
body.night .mid{color:#A79F8E}
body.night p{color:#DCD4C2}
body.night .btn.ghost{color:#9FB39C;border-color:#4A463E}

/* ===== 결산: 오늘 뜬 땀 + 검사필 ===== */
.settleMain{font-size:22px;line-height:1.85;margin:90px 0 34px;text-align:center;
  white-space:pre-line;font-family:var(--f-serif);font-weight:700}
.settleNum{font-size:14px;text-align:center;color:var(--ink3);line-height:2;
  font-family:var(--f-mono)}
.settleNum::before{content:"";display:block;width:190px;height:3px;margin:0 auto 22px;
  background:repeating-linear-gradient(90deg,var(--green) 0 14px,transparent 14px 25px);
  transform:rotate(-1deg)}
.settleNum::after{content:"검사필";display:block;width:78px;height:50px;margin:36px auto 0;
  border:2.5px solid var(--seal);color:var(--seal);
  font-family:var(--f-serif);font-weight:700;font-size:17px;
  letter-spacing:.2em;text-indent:.2em;line-height:45px;text-align:center;
  transform:rotate(-6deg);opacity:.9;
  -webkit-mask-image:radial-gradient(circle at 36% 44%,#000 58%,transparent 76%,#000 92%);
  mask-image:radial-gradient(circle at 36% 44%,#000 58%,transparent 76%,#000 92%);
  animation:stamp .35s cubic-bezier(.3,1.4,.4,1) .9s both}
@keyframes stamp{from{opacity:0;transform:rotate(-2deg) scale(1.4)}
  to{opacity:.9;transform:rotate(-6deg) scale(1)}}

/* ===== 챕터 카드: 견본 태그 ===== */
.chapNum{font-size:11px;letter-spacing:.4em;color:var(--ink2);text-align:center;
  margin:70px 0 26px;font-family:var(--f-mono)}
.chapCard{animation:unfold .8s cubic-bezier(.2,.7,.2,1)}
@keyframes unfold{from{clip-path:inset(0 50% 0 50%);opacity:0}to{clip-path:inset(0 0 0 0);opacity:1}}
.chapPort{position:relative;width:170px;height:170px;border-radius:2px;margin:0 auto 22px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid #4A463E;background:#2A2721;color:#9FB39C;
  box-shadow:0 3px 12px rgba(0,0,0,.4);overflow:hidden}
.chapPort img{width:100%;height:100%;object-fit:cover;display:block}
.chapPort.noimg::after{content:attr(data-i);font-family:var(--f-mono);
  font-size:34px;font-weight:700;color:#9FB39C}
.chapPort::before{content:"";position:absolute;z-index:2;top:11px;left:50%;margin-left:-6px;
  width:12px;height:12px;border-radius:50%;background:var(--night);
  box-shadow:0 0 0 3px #3E3A32}
.chapName{font-size:26px;font-weight:700;color:#F0EADB;text-align:center;letter-spacing:1px;
  font-family:var(--f-serif);animation:sprd 1.1s ease}
@keyframes sprd{from{letter-spacing:14px;opacity:0}to{letter-spacing:1px;opacity:1}}
.chapSub{font-family:var(--f-hand);font-size:20px;color:var(--ink3);text-align:center;
  margin-top:14px;line-height:1.55;transform:rotate(-.6deg)}

/* ===== 타이틀: 옷본 한 장 ===== */
.titleWrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:11vh}
.tAddr{font-size:11px;letter-spacing:.28em;color:var(--ink2);margin-bottom:26px;
  font-family:var(--f-mono)}
.tMain{font-size:42px;font-weight:700;color:#F0EADB;letter-spacing:2px;line-height:1.25;margin:0;
  font-family:var(--f-serif);animation:tin 1.4s cubic-bezier(.2,.7,.2,1)}
@keyframes tin{from{letter-spacing:18px;opacity:0}to{letter-spacing:2px;opacity:1}}
.tPat{position:relative;margin:24px 0 20px}
.tAsc{font-family:var(--f-mono);font-size:8.5px;line-height:10px;color:#7E7565;
  white-space:pre;margin:0;text-align:left}
.tThread{position:absolute;left:9%;width:64%;top:63%;height:3px;
  background:repeating-linear-gradient(90deg,var(--green) 0 14px,transparent 14px 25px);
  transform:rotate(1.5deg);transform-origin:left center}
.tThread::after{content:"";position:absolute;right:-6px;top:-3px;
  width:9px;height:9px;border-radius:50%;background:var(--green)}
.tSub{font-family:var(--f-hand);font-size:20px;color:var(--ink3);line-height:1.6;
  margin:0 0 34px;transform:rotate(-.5deg)}
.tBtns{width:100%;max-width:300px}
.tNote{font-size:11.5px;color:#7A7568;line-height:1.9;margin-top:34px;letter-spacing:.2px}
.tVer{font-size:10.5px;color:#57534A;margin-top:22px;font-family:var(--f-mono);letter-spacing:.18em}

@media (prefers-reduced-motion: reduce){
  .chapCard,.chapName,.tMain,.settleNum::after{animation:none}
  .fade{animation:none}
  html,body,#band,#bandIn,#app{transition:none}
}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>
<body>
<div id="band"><div id="bandIn"><span>재개발 열기 <b id="bR">62%</b></span><span style="opacity:.8;font-size:11px">이태원 맨션</span><span>감정가 <b id="bV">10.0억</b></span></div></div>
<div id="app"><div class="wrap" id="scr"></div></div>

<script>
var VERSION = "v1.0.2";

/* ===== 좌표 (?survey=1 로 수집) ===== */
var SPOTS = [
  {id:0, name:"시작지점", lat:37.541393, lng:126.991978, r:10},   /* 260-34 로즈스튜디오 */
  {id:1, name:"정면 자리", lat:37.541386, lng:126.991632, r:5},   /* 260-87 */
  {id:2, name:"왼쪽 골목", lat:37.541337, lng:126.991200, r:15},   /* 255-84 */
  {id:3, name:"뒷길", lat:37.541539, lng:126.991785, r:9},   /* 260-43 */
  {id:4, name:"가파른 오르막", lat:37.541213, lng:126.991760, r:10},   /* 260-38 */
  {id:5, name:"주차장", lat:37.541472, lng:126.991545, r:5}   /* 회나무로13나길 31 */
];
/* ?reset=1 이면 저장된 것 전부 지우고 새로 시작 */
if(location.search.indexOf('reset=1')>-1){
  try{ localStorage.removeItem('im_spots'); localStorage.removeItem('im_survey'); localStorage.removeItem('im_save'); }catch(e){}
}
/* 저장된 좌표는 같은 버전에서 수집한 것만 쓴다.
   파일 좌표가 바뀌었는데 옛 저장본이 이기는 사고를 막는다 */
var SPOTSRC='파일';
try{
  var SAVED = localStorage.getItem('im_spots');
  var SAVEDV = localStorage.getItem('im_spots_v');
  if(SAVED && SAVEDV===VERSION){ SPOTS = JSON.parse(SAVED); SPOTSRC='현장 수집'; }
  else if(SAVED){ localStorage.removeItem('im_spots'); }
}catch(e){}

/* ===== 인트로 (8컷) ===== */
var INTRO = [
"1992년 겨울.\n이웃집 홍씨네 영감이 땅을 사서 부자가 되었다는 말을 들었다.\n\n봉제공장 셔터를 내렸다.\n내 손과 발이 되어주던 재봉틀 열두 대를 팔았다.",
"차마 한 대는 못 팔았다.\n\n그렇지만 언제까지 미싱을 하고 살 순 없는 노릇 아닌가.",
"이태원에 자투리땅이 있다는데 경사지고 좁았다.\n어딘가 비틀어진 마감이었다.\n\n그치만 시세보다 싸단다. 결국 나는 그 땅을 샀다.\n평생 모은 돈에 은행 돈을 얹었다.\n그 빚이 아직 6억 남아 있다.",
"옆집은 목수 영감이 제 손으로 지은 집이었다.\n\n고르고 골랐는데 하필. 담벼락이 자로 잰 것 같았다.\n계약하고 오는 길에 그 담을 손으로 쓸어봤다.\n\n나는 손을 팔았고 저 영감은 안 팔았구나.\n그 생각을 그날 처음 했다.",
"아내가 그랬다.\n\"여보, 그냥 좁게 짓자. 좁아도 반듯한 게 낫지.\"\n\n나는 대답을 안 했다.\n\n지고 싶지 않아서.",
"나는 딱 하나만 정했다.\n1층은 무조건 옆집보다 넓게.\n\n시공하던 사람이 그랬다.\n사장님, 이러면 아래 마감이 안 삽니다.\n내가 그랬다.\n마감은 나중에 고치면 되는데, 평수는 못 고쳐.\n\n마감. 삼십 년을 마감으로 먹고산 놈이 한 소리다.",
"1994년 봄 준공. 아내가 시루떡을 쪘다.\n페인트는 아내가 골랐다. 초록으로.\n\n준공하고 나니 돈이 없었다. 마감은 나중에 하기로 했다.\n아내는 이 집에서 2년을 더 살고 갔다.\n\n나중은 삼십 년이 됐다.",
"나는 일흔여덟이다.\n아직 그 건물 꼭대기에 산다. 1층은 비어 있다.\n골목에 재개발 동의서가 돈다.\n\n지금부터 당신은 김씨입니다."
];

/* ===== 걷기 ===== */
var WALK = [
 {to:1, txt:"회나무로13나길을 따라 서쪽으로 걸으세요.\n왼쪽에 숲 놀이터가 나타나면 그 입구쯤에서 멈추세요.\n길 건너에 그 건물이 있습니다."},
 {to:2, txt:"건물을 등지고 골목을 따라 더 내려가세요.\n골목 끝이 넓어지는 곳까지."},
 {to:3, txt:"왔던 골목을 그대로 되짚어 오르세요.\n서두르지 마세요. 숨이 조금 차야 맞습니다.\n건물을 지나, 모퉁이에서 왼쪽 오르막으로.",
  mid:"사람들이 우리 집을 언덕집이라고 한다.\n언덕은 무슨. 이 길로 와보라고 하면 다들 말이 없다.\n이게 평지지, 뭐가 평지야.\n\n올라오다 전봇대에서 한 번 서긴 한다.\n그건 길 때문이 아니라 내 나이 때문이다."},
 {to:4, txt:"가파른 길로 올라가세요.\n사장님이 삼십 년 동안 아무도 안 데려온 그 길로."},
 {to:5, txt:"건물을 향해 다시 내려가세요.\n이번에는 지나치지 말고 건물 옆 주차장으로 들어가세요.\n\n처음으로, 집에 닿는 거리입니다."}
];



/* ===== 세션 데이터 =====
choices: [텍스트, 크기, dR, dV(0.1억), 속말, 특수]
크기: big=우김 / mid=깎기 / small=속말 */
var S = [
{ spot:0, name:"파프리 공인중개사", ini:"파", sub:"이 골목 삼십 년.<br>김씨에게 땅을 팔고, 모든 세입자를 계약해준 사람",
  see:"이제부터 이곳은 파프리 공인중개사입니다.\n삼십 년 전 당신에게 그 땅을 팔았던 곳이지요.\n원룸도 투룸도 다 이 집에서 빼줍니다.\n\n유리문 안에서 중개인이 부산을 떨며 무언가 찾고 있습니다.\n당신은 기다리고 있습니다.",
  recall:["이 부동산이 생긴 게 우리 건물 준공하던 해였다.\n저 사람이랑 나랑 이 골목 나이가 같다.",
"첫 세입자 계약서 쓰던 날 저 사람이 그랬다.\n\"사장님, 이 건물 1층이 골목서 제일 넓네요.\"\n\n나는 그 말을 삼십 년 기억한다.\n저 사람은 기억 못 할 거다."],
  beats:[
   {say:"\"김 사장님? 커피 식으니까 들면서 들어요.\n\n오늘 아침에 재개발 조합에서 다녀갔어요.\n사장님 얘기만 하다 갔어.\n\n오늘은 대답을 좀 하셔야 돼요. 십 년째 안 하시잖아요.\n\n재개발 동의하실 거예요? 안 하실 거예요?\"",
    ch:[["내가 대답을 안 해서 이 동네가 십 년 버틴 거야.", "big", 1, 2, 0],
        ["대답할 게 뭐 있어. 다 쓰러져가는 동네인데.", "mid", -1, -2, 0],
        ["…내가 십 년 그랬나. 그걸 자네가 세고 있었구먼.", "small", 0, 0, 1]],
    re:["\"그 버티기 이제 안 통해요. 거의 다 동의한 거 몰라요?\"",
        "\"그 말 조합 귀에 들어가면 값부터 깎여요.\"",
        "\"세죠. 저도 이 골목 삼십 년인데요.\""], gauge:true},
   {say:"\"사장님, 저거 봐요, 위에 뜬 거.\n왼쪽이 재개발 열기고, 오른쪽이 사장님 건물 감정가예요.\n\n건물 자랑을 하면요, 돈 된다는 소문이 돌 겁니다.\n하나라도 높은 값에 사려고 혈안이 되겠죠.\n재개발 열기가 75%가 넘으면 사장님 동의 없어도 진행될 거예요.\n\n반대로 흉을 보잖아요? 점점 집의 가치가 떨어질 겁니다.\n6억 밑으로 꺼지면 은행이 가져가요. 사장님네 대출이 6억이잖아요.\n\n…그럼 어쩌라는 거냐. 사실대로만 말하는 거죠.\n오래됐고, 손 갈 데 있고, 그래도 서 있는 건물이라고.\n사실은 소문이 안 나요. 심심하니까.\n\n근데 사장님, 사장님이 그걸 하실 수 있겠어요?\"",
    ch:[["사실인 걸 뭐. 자랑할 거야. 제일 넓은 건물이니까.", "big", 2, 4, 0],
        ["흉볼 거야. 물 새는 건물이라고.", "mid", -2, -4, 0],
        ["…사실대로가 제일 어렵구먼.", "small", 0, 0, 1]],
    re:["\"그럼 왼쪽이 오르겠네요. 보세요, 오르나 안 오르나.\"",
        "\"그 말은 은행 귀에도 들어갈걸요.\"",
        "\"어렵죠. 삼십 년 안 해보신 거니까.\""]},
   {say:"\"1층 그 아주머니요. 사장님네 첫 세입자.\n삼십 년 계시다 올봄에 나가셨죠.\n\n나가면서 그러시더라고요. 주인 양반이 자꾸 내려온다고.\n고쳐주는 것도 아니고 문 앞에서 미싱 소리만 듣다 간다고.\n\n저는 감시하시는 줄 알았어요. …아니었죠?\"",
    ch:[["감시는 무슨. 내 건물인데 못 내려가나.", "big", 1, 2, 0],
        ["그 집이 뭐 대단하다고. 나가서 잘된 거지.", "mid", -1, -2, 0],
        ["…그 아주머니한테는 아직 말을 못 했네.", "small", 0, 0, 1]],
    re:["\"그건 그렇죠. 사장님 건물이니까.\"",
        "\"삼십 년 계셨는데요, 사장님.\"",
        "\"오늘 이따 오실 거예요. 열쇠 돌려주신다고.\""]},
   {say:"\"사실 장부에 그 건물 주소로 안 적어놨어요.\n손님들이 그 이름으로 물어보거든요. 주소보다 그게 빨라서.\n\n(눈치를 보며) 알고 계셨어요…?\n\n…오늘은 안 알려드릴래요. 어차피 듣게 되실 테니까.\"",
    ch:[["이태원 맨션이라는 멀쩡한 이름이 있는데!", "big", 2, 2, 0],
        ["뭐라고 적든. 저런 건물에 이름은 무슨.", "mid", -2, -4, 0],
        ["…마감 후진 집. 그렇게 적어놨나.", "small", 0, 0, 1]],
    re:["\"고쳐드릴게요. 근데 손님들 입은 내가 못 고쳐요.\"",
        "\"이름이 값을 매겨요, 사장님.\"",
        "\"……알고 계셨구나. (장부를 덮는다)\""]},
   {say:"\"얼른 결정하시고 알려주세요.\n오늘 골목 한 바퀴 돌아보시고요.\n\n저녁에 다시 들르세요.\n어차피 제가 다 알고 있을 겁니다.\"",
    ch:[],
    re:[]}
  ]},

{ spot:1, name:"최고령 주민", ini:"주", sub:"골목 사십 년.<br>김씨보다 먼저 온 사람. 김씨의 아내를 아는 사람",
  see:"길 건너에서 1층을 보세요.\n언덕에 눌려서 반쯤 파묻혀 있지 않나요?\n\n저 1층이 등기부상 이 골목에서 제일 넓습니다.\n진짜 그렇게 보입니까?",
  recall:["경사지에서 평수를 뽑으려니\n건물이 언덕 아래로 몸을 내밀어야 했다.",
"등기부에는 내가 이겼다고 적혀 있다. 골목에서 제일 넓다고.\n근데 겉에서 보면 제일 좁아 보이는 게 저 1층이다. 나도 안다.",
"저 초록 띠, 기울어 보이지. 길이 기운 거다.\n페인트는 아내가 골랐다. 그것만은 내가 안 고쳤다."],
  beats:[
   {say:"\"김씨 아니야. 여기 서 있을 줄 알았어.\n\n…나 이거 받았어. (접힌 종이를 꺼내 보인다)\n어제도 조합에서 두 시간 앉았다 갔어. 아들네 가서 편히 사시라고.\n\n나 아직 안 썼어. 자네 보고 정하려고.\"",
    ch:[["그딴 거 쓰지 마시오. 나 안 쓰는데 왜 쓰시오.", "big", -2, -2, 0],
        ["쓰든 말든 어르신 마음이지. 나한테 왜 물어보시오.", "mid", 0, -2, 0],
        ["…나 보고 정한다는 말은 마시오. 그 말 무겁소.", "small", 0, 0, 1]],
    re:["\"자네가 그럴 줄 알았어. 그럼 나도 좀 더 뭉개보지.\"",
        "\"물어보지. 사십 년을 같이 살았는데. 자네가 남인가.\"",
        "\"무거우면 자네가 지게. 자네 때문에 안 쓰는 거 맞으니까.\""]},
   {say:"\"근데 김씨, 저 초록 띠 말이야. 삐뚜름해.\n길 따라 칠해놔서 멀리서 보면 집이 기운 것 같아.\n\n수평으로 좀 칠하지 그랬어.\"",
    ch:[["기울어 보이는 건 착시요. 길이 기운 거지.", "big", 2, 4, 0],
        ["이제 와서 뭘. 어차피 다 삐뚤어진 건물인데.", "mid", -2, -4, 0],
        ["…저 색은 아내가 골랐소. 그것만은 안 고쳤소.", "small", 0, 0, 1]],
    re:["\"하이고, 착시래. 사십 년째 자네답네.\"",
        "\"그런 말 말어. 집 듣겠네.\"",
        "\"…알지. 자네 색시가 골랐지.\n시루떡 돌리던 날 내가 얻어먹었어.\""]},
   {say:"\"김씨, 내가 하나 물어봐도 되나.\n\n자네 색시가 준공 전에 우리 집에 온 적이 있어.\n좁게 짓자고 했는데 자네가 대답을 안 한다고. 나보고 말 좀 해달라고.\n\n…나 그 말 안 전했어. 부부 일에 낀다 싶어서.\n사십 년 그게 걸리네.\"",
    ch:[["좁게 지었으면 이 값도 못 받소. 내 말이 맞았지.", "big", 2, 4, 0],
        ["다 지난 얘기요. 그 사람도 갔고 집도 이 꼴이고.", "mid", -1, -4, 0],
        ["…그때 대답을 안 한 게 아니라 못 한 거요. 대답하면 지는 거라.", "small", 0, 0, 1]],
    re:["\"그래. 자네 말이 맞았지.\n근데 색시는 그 값 못 봤잖아.\"",
        "\"지난 얘기라고 안 아픈가.\"",
        "\"……. (한참 있다가)\n그럼 사십 년을 이겨서 뭐 했나, 자네.\""]},
   {say:"\"김씨, 이제 솔직히 말해봐. 이 골목, 살 만한 것 같아?\n\n계단은 얼고 여름엔 하수구 냄새 나고 슈퍼도 없어졌어.\n물 한 병 사러 큰길까지 나가.\n\n자네가 그렇다고 하면 나 쓸라고. 아니라고 하면 안 쓸 거고.\"",
    ch:[["좋은 골목이오. 사십 년 사셨으면 아시잖소.", "big", 2, 6, 0],
        ["솔직히 여긴 끝났소. 어르신도 아시잖소.", "mid", 9, -8, 0, "elder"],
        ["…재개발이 필요한 곳이긴 하오. 근데 나는 여기밖에 없소.", "small", 0, 0, 1]],
    re:["\"자네 말이 맞네. (종이를 도로 접는다) 나도 안 쓰네.\"",
        "\"…자네도 그렇게 생각했구나. (한참 종이를 본다)\n그럼 나 쓰겠네.\"",
        "\"나도 여기밖에 없어. (웃는다) 우리 둘 다 갈 데가 없구먼.\""]},
   {say:"\"내 정신 좀 봐. 이제 가봐야겠네.\n\n자네, 말은 자네 생각보다 빨리 돌아.\n이만 가봅세.\"",
    ch:[],
    re:[]}
  ]},

{ spot:2, name:"마지막 세입자", ini:"세", sub:"1층에서 삼십 년.<br>첫 세입자이자 마지막 세입자. 올봄에 나간 사람",
  see:"골목 끝에서 건물의 왼쪽 얼굴을 보세요.\n1층 유리 안에 커튼이 쳐져 있습니다.\n\n커튼은 누가 친 걸까요.",
  recall:["사람들이 우리 집을 언덕집이라고 한다.\n언덕은 무슨. 이게 평지지.",
"손님이 오면 꼭 이 길로 데려왔다.\n가파른 길로 오면 무릎만 아프지 않나. 고작 5분 차이다.\n8분이 걸려도 나는 이 길로만 다닌다.",
"중간에 한 번 서긴 한다.\n그건 길 때문이 아니라 내 나이 때문이다."],
  beats:[
   {say:"\"사장님, 오늘도 그 길로 오시네요.\n\n손님들 꼭 이 길로 데려오셨잖아요. 8분 걸려서요.\n그러고는 그러셨죠. \"봐요, 평지죠?\"\n\n손님들 다 숨차서 대답을 못 했어요, 사장님.\"",
    ch:[["대답 못 한 게 아니라 인정한 거지. 평지 맞으니까.", "big", 1, 2, 0],
        ["숨차긴. 요즘 사람들이 안 걸어서 그래.", "mid", -1, -2, 0],
        ["…자네도 알고 있었구먼.", "small", 0, 0, 1]],
    re:["\"네. 다들 고개는 끄덕여주셨죠.\"",
        "\"저는 매일 걸었는데요, 사장님. 삼십 년을.\"",
        "\"다 알았어요. 사장님만 계속 물어보셨죠.\n평지죠? 이 정도면 평지죠?\n\n…아, 저 전봇대 옆 의자 제가 내놓은 거예요.\n삼십 년 동안 한 번도 안 앉으셨지만요.\""]},
   {say:"\"저 열쇠 돌려드리러 왔어요.\n\n사장님, 저 재작년에 5년 계약 하고 싶다고 했잖아요.\n세 번 여쭤봤고, 세 번 다 생각해보자고 하셨어요.\n\n…화내는 거 아니에요. 그냥 아셨으면 해서요.\"",
    ch:[["재개발이 걸린 마당에 무슨 수로 5년을 약속해.\n자네가 이만한 자리를 어디서 구하나.", "big", 2, 2, 0],
        ["자네도 알잖나, 이 건물 상태. 겉만 멀쩡하지.", "mid", -1, -8, 0],
        ["…약속을 하면 지켜야 하는데, 내가 지킬 수 있는 게 없었네.", "small", 0, 0, 1]],
    re:["\"그 말씀을 그때 해주셨으면 저 1년 일찍 나왔을 거예요.\"",
        "\"저는 건물이 문제가 아니었어요, 사장님. 대답이 문제였지.\"",
        "\"……. 그 말씀이 그렇게 어려우셨어요?\""]},
   {say:"\"창고에 있던 그 미싱이요.\n오래된 것 치고 관리가 너무 잘 돼 있던데.\n\n왜 저를 주셨어요?\n다시 받으시려고 문 앞에 서 계셨던 건 아니죠?\"",
    ch:[["내 건물인데 내가 못 서 있나.", "big", 1, 2, 0],
        ["낡아빠진 거 하나 버린 거지. 뭔 의미를 부여하나.", "mid", -1, -4, 0],
        ["…공장 접고 나니까, 그 소리가 그렇게 듣고 싶더라고.", "small", 0, 0, 1]],
    re:["\"네. 사장님 건물이죠. (열쇠를 내려놓는다)\"",
        "\"아… 네. 그런 거였구나.\"",
        "\"……. 그럼 문 앞에 서 계실 게 아니라 들어오시지 그랬어요.\n커피 내드렸을 텐데.\""]},
   {say:"\"하나만 물어볼게요. 재개발 안 되면 저 다시 들어올 수 있어요?\n\n대답 안 하셔도 돼요. 익숙해요.\n근데 오늘은 한 번만 해주세요.\"",
    ch:[["이만한 건물이 없지. 들어와. 자리 비워둘 테니까.", "big", -1, 4, 0],
        ["이런 다 죽은 동네를 왜 다시 들어와. 일단 보자고.", "mid", -1, -4, 0],
        ["…약속은 못 하겠고, 자네 번호는 안 지웠네.", "small", 0, 0, 1]],
    re:["\"(열쇠를 도로 주머니에 넣는다)\n그럼 이거 조금만 더 갖고 있을게요.\"",
        "\"(열쇠를 손에 쥔 채로) 네. 알겠습니다, 사장님.\"",
        "\"……. (웃는다) 그거면 됐어요, 사장님.\""]},
   {say:"\"가세요, 늘 다니시던 길로.\n\n…사장님, 그거 평지 아니에요.\n아셔도 되고 모르셔도 되는데, 저는 오르막이라고 말할게요.\n\n사장님한테 그 말 한 사람이 하나는 있어야 될 것 같아서요.\"",
    ch:[],
    re:[]}
  ]},

{ spot:3, name:"재개발 추진위원", ini:"추", sub:"김씨 다음 반장.<br>김씨에게 계단 쓰는 법을 배운 사람",
  see:"내려가면서 건물을 보세요.\n당신 발밑에 건물이 있습니다.\n\n지붕이 보입니다. 창문이 보입니다.\n1층은 보이지 않습니다.",
  recall:["나는 여기 자주 온다. 여기서 보면 우리 건물이 제일 멋있다.\n지붕도 반듯하고 창도 크고. 1층이 안 보이거든.",
"아내도 이 길을 좋아했다.\n밤에 혼자 올라와서 지어지는 집을 보다 갔다고 했다.\n\n나는 그때 아내가 완성될 집을 보는 줄 알았다.",

var ENDINGS = {
 A1:{t:"평수만 남았다", b:"결국 재개발로 헐렸어요.\n\n김씨가 보상 협상 자리에서도 평수 얘길 했거든요. 등기부까지 떼어 왔더라고요.\n감정평가사가 그랬대요. 네, 확인했습니다. 그러고 넘어갔어요.\n\n결국 남들 받는 만큼 받았어요. 딱 남들만큼.\n\n아, 이사 가는 날 대패가 하나 나왔는데 누구 건지 몰라서 버렸다더라고요.\n미싱도요.",

 A2:{t:"이사", b:"결국 재개발로 헐렸어요.\n\n김씨는 보상 잘 받고 아드님네 근처로 갔어요. 새 아파트요. 마감도 반듯하고.\n\n근데 요즘 김씨는 평수 얘길 안 해요. 삼십 년을 그 소리만 하던 사람이요.\n\n베란다에 미싱을 뒀대요.\n아파트에 미싱을 왜 두냐니까, 소리가 나야 잠이 온다고 그러더래요.",
    g:"얻은 것: 돈, 그리고 그 말을 그만둔 것", l:"잃은 것: 그 집"},
 B1:{t:"건물은 남고 김씨만 나갔다", b:"재개발은 무산됐어요. 김씨가 이긴 거죠.\n\n근데 그 건물, 이제 김씨 것이 아니에요.\n김씨가 하고 다닌 말 있잖아요. 이 동네가 개발 가치가 없다는.\n조합도 그 말 듣고 접었고 은행도 그 말 듣고 접었어요. 같은 말이었거든요.\n\n김씨요? 글쎄요. 어디서 다시 봉제 일을 한다고 들은 것 같은데요.\n일흔여덟에요.",
    g:"얻은 것: 이겼다는 사실", l:"잃은 것: 건물"},
 B2:{t:"열쇠", b:"결국 건물이 경매로 넘어갔어요. 최악이죠.\n\n근데 웃긴 게, 1층에 그 수선집이 다시 들어왔어요.\n새 주인한테 세 얻어서요. 열쇠를 안 버렸더라고요.\n\n김씨요? 가끔 거기 앉아 있어요. 미싱 소리 들으면서요.\n이제 자기 건물도 아닌데. 커피를 내준대요. 아저씨 앉으세요, 하면서요.\n\n삼십 년을 문 앞에 서 계시던 양반이, 이제 안에 앉아 있어요.\n건물은 없고 사람은 남았어요. 그게 남은 건지는 나도 모르겠고요.",

function newGame(){
  var shuf=[];
  for(var s=0;s<S.length;s++){ var arr=[];
    for(var b=0;b<S[s].beats.length;b++){
      var n=S[s].beats[b].ch.length, o=[0,1,2].slice(0,Math.max(n,0));
      for(var k=o.length-1;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=o[k];o[k]=o[j];o[j]=t; }
      arr.push(o);
    } shuf.push(arr); }
  return {R:62,V:100,sok:0,sign:false,elder:false,log:[],phase:'title',si:0,bi:0,ri:0,wi:0,
          pR:0,pV:0,pS:0,dR:0,dV:0,dS:0,shuf:shuf,ic:0,remote:null};
}

}

/* ===== GPS ===== */
function startGPS(){
  if(!navigator.geolocation || watchId!==null) return;
  watchId = navigator.geolocation.watchPosition(function(p){
    pos = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, t:p.timestamp};
    pushFix(pos);
    if(G && G.phase==='walk') tickWalk();
    /* 측정 중에는 화면을 다시 그리지 않는다. 그리면 버튼이 날아간다 */
    if(SURVEY && !window.__measuring) drawSurvey();
    if(SURVEY && window.__measuring) pushSample();
  }, function(e){}, {enableHighAccuracy:true, maximumAge:0, timeout:20000});
}
/* 측정 중 표본 누적. 타임스탬프가 새 것일 때만 인정 */
var SMP=[], SMPlast=0;
function pushSample(){
  if(!pos || !pos.t || pos.t===SMPlast) return;
  SMPlast = pos.t;
  if(pos.acc<=80) SMP.push({lat:pos.lat, lng:pos.lng, acc:pos.acc});
}
/* 아이폰이 watch를 게을리 할 때를 대비한 강제 조회 */
function pokeGPS(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(p){
    pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:p.timestamp};
    if(window.__measuring) pushSample();
  }, function(){}, {enableHighAccuracy:true, maximumAge:0, timeout:8000});
}
/* ===== 위치 평활화 =====
   순간 좌표는 많이 튄다. 최근 12초치를 정확도로 가중평균해서 쓴다 */
var FIX=[];
function pushFix(p){
  if(!p) return;
  FIX.push({lat:p.lat, lng:p.lng, acc:p.acc, t:Date.now()});
  var cut=Date.now()-12000;
  while(FIX.length && (FIX[0].t<cut || FIX.length>14)) FIX.shift();
}
function smoothPos(){
  if(!FIX.length) return pos;
  var ws=0, la=0, ln=0, best=999;
  for(var i=0;i<FIX.length;i++){
    var f=FIX[i], age=(Date.now()-f.t)/1000;
    var w = 1/(f.acc*f.acc) * Math.exp(-age/8);   /* 정확할수록, 최근일수록 무겁게 */
    ws+=w; la+=f.lat*w; ln+=f.lng*w;
    if(f.acc<best) best=f.acc;
  }
  return {lat:la/ws, lng:ln/ws, acc:Math.max(3, best/Math.sqrt(FIX.length)), n:FIX.length};
}
/* 시작 지점에서 잰 GPS 치우침을 나머지 지점에 똑같이 빼준다 */
function calPos(){
  var p = smoothPos();
  if(!p) return null;
  if(!G || !G.cal) return p;
  return {lat:p.lat-G.cal.dLat, lng:p.lng-G.cal.dLng, acc:p.acc, n:p.n};
}
/* 어느 지점이 제일 가까운가. 절대 오차가 커도 순위는 잘 맞는다 */
function rankSpots(p){
  var r=[];
  for(var i=0;i<SPOTS.length;i++) r.push({i:i, d:dist(p,SPOTS[i])});
  r.sort(function(a,b){return a.d-b.d;});
  return r;
}
function dist(a,b){
  var R=6371000, t1=a.lat*Math.PI/180, t2=b.lat*Math.PI/180;
  var dt=(b.lat-a.lat)*Math.PI/180, dl=(b.lng-a.lng)*Math.PI/180;
  var x=Math.sin(dt/2)*Math.sin(dt/2)+Math.cos(t1)*Math.cos(t2)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function tickStart(){
  if(!G || G.phase!=='start'){ clearInterval(STtimer); return; }
  var sp=SPOTS[0];
  var de=document.getElementById('dist'), ae=document.getElementById('acc'), bx=document.getElementById('stbox');
  if(!de){ clearInterval(STtimer); return; }
  if(pos){
    var d=dist(pos,sp);
    de.innerHTML = d<150 ? ('시작 지점까지 <b>'+Math.round(d)+'m</b>') : ('시작 지점까지 <b>'+(Math.round(d/10)*10)+'m</b>');
    ae.textContent='GPS 오차 약 '+Math.round(pos.acc)+'m';
    if(d<=sp.r && !bx.innerHTML) return confirmStart(true);
  } else {
    de.innerHTML='<b style="font-size:14px">위치를 찾는 중…</b>';
    ae.textContent='하늘이 트인 곳에서 더 잘 잡힙니다';
  }
  var farNow = pos && dist(pos,sp) > 300;
  if(!bx.innerHTML && farNow && (Date.now()-stStart>4000)){
    bx.innerHTML='<div class="toast"><b>현장에서 멀리 떨어져 있습니다</b><br>'+
      '지금 자리에서 시작 지점까지 '+Math.round(dist(pos,sp)/100)/10+'km 입니다.<br>'+
      '앉아서 읽기로 진행하시면 걷지 않고 이야기를 볼 수 있습니다.</div>'+
      '<button class="btn" id="far2">앉아서 읽기</button>'+
      '<button class="btn ghost sm" id="here3">그래도 여기서 시작</button>';
    document.getElementById('far2').onclick=function(){
      clearInterval(STtimer); G.remote=true; G.phase='intro'; G.ic=0; save(); route(); };
    document.getElementById('here3').onclick=function(){ confirmStart(false); };
    return;
  }
  if(!bx.innerHTML && (Date.now()-stStart>12000)){
    bx.innerHTML='<button class="btn" id="here">여기가 시작 지점입니다</button>'+
      '<p class="small" style="text-align:center;margin-top:6px">파프리 공인중개사 앞에 서 계시면 눌러주세요</p>'+
      '<button class="btn ghost sm" id="far">현장이 아닙니다. 앉아서 읽기</button>';
    document.getElementById('here').onclick=function(){ confirmStart(false); };
    document.getElementById('far').onclick=function(){
      clearInterval(STtimer); G.remote=true; G.phase='intro'; G.ic=0; save(); route();
    };
  }
}
function confirmStart(auto){
  clearInterval(STtimer);
  var sp=SPOTS[0];
  if(pos){
    var dLat=pos.lat-sp.lat, dLng=pos.lng-sp.lng;
    /* 60m 넘게 벌어지면 그 자리가 아니라고 보고 보정하지 않는다 */
    if(dist(pos,sp) <= 60) G.cal={dLat:dLat, dLng:dLng};
  }
  G.remote=false; G.phase='intro'; G.ic=0; save();
  var msg = auto ? '시작 지점에 도착했습니다.' : '기준을 여기로 맞췄습니다.';
  var sub = G.cal ? ('이 위치를 기준으로 나머지 장소를 안내합니다.') : ('');

  tapNext(function(){ route(); });
}

  if(G.phase==='react') return scrReact();
  if(G.phase==='settle') return scrSettle();

  h+='<p class="chapNum">'+ORD[G.si]+' 번째 만남</p>';
  h+='<div class="chapPort"><img src="img/ch_'+G.si+'.jpg" alt="" '+
     'onerror="this.style.display=\'none\';this.parentNode.classList.add(\'noimg\');this.parentNode.setAttribute(\'data-i\',\''+s.ini+'\')"></div>';
  h+='<p class="chapName">'+s.name+'</p>';
  h+='<p class="chapSub">'+(s.sub||'')+'</p>';
  h+='</div>';
  h+='<p class="tapHint" style="margin-top:56px">화면을 누르면 계속됩니다</p>';
  html(h, true);
  tapNext(function(){ G.phase='see'; save(); route(); });
}

function scrSee(){
  var s=S[G.si];
  html('<p class="see serif">'+s.see+'</p><p class="tapHint">화면을 누르면 계속됩니다</p>');
  tapNext(function(){ G.phase='recall'; G.ri=0; save(); route(); });
}
function scrRecall(){
  var s=S[G.si];
  if(G.ri>=s.recall.length){ G.phase='beat'; G.bi=0; return route(); }
  html('<p class="recall serif">'+s.recall[G.ri]+'</p><p class="tapHint">화면을 누르면 계속됩니다</p>', true);
  tapNext(function(){ G.ri++; save(); route(); });
}
function scrBeat(){
  var s=S[G.si], b=s.beats[G.bi];
  if(!b){ return endSession(); }
  var say=b.say;
  if(b.altElder && G.elderNow){ say=b.altElder; }
  var h='<div class="npc">'+chipBox(G.si, s.ini)+'<div class="npcname">'+s.name+'</div></div>';
  h+='<p class="say">'+say+'</p>';
  if(b.ch.length===0){
    h+='<p class="tapHint">화면을 누르면 계속됩니다</p>';
    html(h);
    tapNext(function(){ G.bi++; save(); route(); });
    return;
  }
  var order=G.shuf[G.si][G.bi];
  for(var i=0;i<order.length;i++){
    var c=b.ch[order[i]];
    h+='<button class="ch '+c[1]+'" data-i="'+order[i]+'">'+c[0]+'</button>';
  }
  html(h);
  var bs=scr.querySelectorAll('.ch');
  for(var j=0;j<bs.length;j++) bs[j].onclick=function(ev){
    if(ev){ ev.stopPropagation(); }
    if(locked()) return;
    pick(parseInt(this.getAttribute('data-i')));
  };
  if(b.gauge){ /* 게이지 등장 비트: band는 이미 표시 중 */ }
}
function pick(i){
  var s=S[G.si], b=s.beats[G.bi], c=b.ch[i];
  G.pR+=c[2]; G.pV+=c[3]; G.pS+=c[4]; G.sok+=c[4];
  if(c[5]==='sign') G.sign=true;
  if(c[5]==='elder'){ G.elder=true; G.elderNow=true; }
  G.log.push(c[0]);
  G.lastPick=i; G.phase='react'; save(); route();
}
function scrReact(){
  var s=S[G.si], b=s.beats[G.bi];
  var h='<div class="npc">'+chipBox(G.si, s.ini)+'<div class="npcname">'+s.name+'</div></div>';
  h+='<p class="say">'+b.re[G.lastPick]+'</p>';
  h+='<p class="tapHint">화면을 누르면 계속됩니다</p>';
  html(h);
  tapNext(function(){ G.bi++; G.phase='beat'; save(); route(); });
}

function endSession(){
  var calm = G.pS>=2;
  var aR = calm?0:1, aV = calm?0:-2;
  G.R=Math.max(0,Math.min(100,G.R+G.pR+aR));
  G.V=Math.max(0,Math.min(140,G.V+G.pV+aV));
  G.dR=G.pR+aR; G.dV=G.pV+aV; G.dS=G.pS; G.calm=calm; G.pR=0; G.pV=0; G.pS=0;
  G.elderNow=false;
  G.elderJust=(G.elder && !G.elderShown); if(G.elderJust) G.elderShown=true;
  var done = (G.V<=60 || G.sign || G.R>=75 || G.si>=5);
  if(!done){ G.wi=G.si; G.si++; }
  G.next = done ? 'ending' : 'walk';
  G.phase='settle'; save(); route();
}

function scrSettle(){
  band();
  var main, sub;
  if(G.calm){ main='별 소문이 없었다.\n사실은 심심해서.'; sub='조합도 오늘은 그냥 지나갔다.'; }
  else if(G.dR>1){ main='돈이 된다는 소문이 돌았다.'; sub='조합이 오늘도 골목을 돌았다.'; }
  else if(G.dV<-2){ main='돈이 안 된다는 소문이 돌았다.'; sub='은행 쪽에서 전화가 한 번 왔다 끊겼다.'; }
  else { main='그 말이 골목을 돌았다.'; sub='조합이 오늘도 골목을 돌았다.'; }
  var h='<p class="settleMain serif">'+main+'</p>';
  h+='<p class="settleNum">재개발 열기 '+(G.dR>=0?'+':'')+G.dR+' · 감정가 '+(G.dV>=0?'+':'')+(G.dV/10).toFixed(1)+'억<br><span style="opacity:.7">'+sub+'</span>'+(G.elderJust?'<br><br><b style="color:#F0EADB">노인이 종이에 이름을 썼다.<br>험담은 건물만 깎는 게 아니었다.</b>':'')+'</p>';
  h+='<p class="tapHint" style="margin-top:60px">화면을 누르면 계속됩니다</p>';
  html(h, true);
  tapNext(function(){
    G.phase=G.next;
    if(G.next==='walk'){ walkStart=Date.now(); midShown=false; }
    else { G.ei=0; }
    save(); route();
  });
}

/* 지점 사진. img/lm_N.jpg 가 없으면 글자만 남는다 */
/* 대화 화면의 작은 인물 초상. 이미지가 없으면 이니셜 글자로 */
function chipBox(i, ini){
  return '<div class="chip"><img src="img/ch_'+i+'.jpg" alt="" '+
    'onerror="this.style.display=\'none\';this.parentNode.classList.add(\'noimg\');'+
    'this.parentNode.setAttribute(\'data-i\',\''+ini+'\')"></div>';
}

function lmBox(i, name, cap){
  cap = (cap===undefined) ? ('다음 지점 · '+name) : cap;
  return '<div class="lm"><img src="img/lm_'+i+'.jpg" alt="" loading="lazy" '+
    'onerror="this.onerror=null;this.src=\'img/lm_'+i+'.png\';this.setAttribute(\'data-f\',1);'+
    'if(this.getAttribute(\'data-f2\')){this.style.display=\'none\';this.parentNode.textContent=\''+name.replace(/'/g,"")+'\';}else{this.setAttribute(\'data-f2\',1);}">'+
    '<span class="lmcap">'+cap+'</span></div>';
}

function scrWalk(){
  var w=WALK[G.wi], sp=SPOTS[w.to];
  if(G.remote){ return scrWalkRemote(w,sp); }
  var h='';
  h+=lmBox(w.to, sp.name);
  h+='<p class="guide serif">'+w.txt+'</p>';
  h+='<div id="mapbox"></div>';
  h+='<div id="dist">남은 거리 <b>--</b></div><div id="acc"></div>';
  h+='<div id="arrivebox"></div>';
  html(h);
  drawMap();
  tickWalk();
}

function scrWalkRemote(w,sp){
  var h='';
  h+=lmBox(w.to, sp.name);
  h+='<p class="guide serif">'+w.txt+'</p>';
  h+='<p class="small" style="text-align:center;margin-top:22px">현장 밖에서 플레이 중입니다. 걷기를 건너뛸 수 있어요.</p>';
  h+='<button class="btn" id="bk">다음 장소로</button>';
  html(h);
  document.getElementById('bk').onclick=function(ev){
    if(ev){ ev.stopPropagation(); }
    if(locked()) return;
    if(w.mid && !midShown){ midShown=true; showMid(w.mid); return; }
    arriveNow();
  };
}

function drawMap(){
  var box=document.getElementById('mapbox'); if(!box) return;
  var target=SPOTS[WALK[G.wi].to];
  var W=280,H=150, cx=W/2, cy=H/2;
  var s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-height:170px;display:block">';
  if(pos){
    var mLat=111320, mLng=111320*Math.cos(pos.lat*Math.PI/180);
    var dx=(target.lng-pos.lng)*mLng, dy=(target.lat-pos.lat)*mLat;
    var d=Math.sqrt(dx*dx+dy*dy);
    var sc = d>1 ? Math.min(52/d, 1.2) : 1;
    var tx=cx+dx*sc, ty=cy-dy*sc;
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+tx.toFixed(1)+'" y2="'+ty.toFixed(1)+'" stroke="#C9C3B0" stroke-width="5" stroke-linecap="round"/>';
    s+='<circle cx="'+tx.toFixed(1)+'" cy="'+ty.toFixed(1)+'" r="12" fill="none" stroke="#41543F" stroke-width="1.4" stroke-dasharray="3 3"/>';
    s+='<text x="'+tx.toFixed(1)+'" y="'+(ty+4).toFixed(1)+'" text-anchor="middle" font-size="11" fill="#41543F">'+target.id+'</text>';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="10" fill="#6E8B74" opacity=".2"/>';
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="#41543F"/>';
    s+='<text x="'+cx+'" y="'+(cy+22)+'" text-anchor="middle" font-size="10" fill="#A29C88">나</text>';
  } else {
    s+='<text x="'+cx+'" y="'+cy+'" text-anchor="middle" font-size="11" fill="#A29C88">위치를 찾는 중</text>';
  }
  s+='</svg>';
  box.innerHTML=s;
}

function tickWalk(){
  if(!G || G.phase!=='walk') return;
  var w=WALK[G.wi], sp=SPOTS[w.to];
  if(G.remote==null){
    if(GHOST){ G.remote=true; save(); return scrWalk(); }
    if(pos){
      G.remote = dist(calPos()||pos,sp) > 300;
      save();
      if(G.remote) return scrWalk();
    } else if(Date.now()-walkStart > 8000){
      G.remote=true; save(); return scrWalk();
    }
  }
  var cp = calPos();
  var d = cp ? dist(cp,sp) : null;
  var rk = cp ? rankSpots(cp) : null;
  var de=document.getElementById('dist'), ae=document.getElementById('acc');
  if(!de) return;
  if(d!==null){
    de.innerHTML = d<100 ? ('남은 거리 <b>'+Math.round(d)+'m</b>'+(d<=25?'<br><span style="font-size:12px">거의 다 왔습니다</span>':''))
                         : ('남은 거리 <b>'+(Math.round(d/10)*10)+'m</b>');
    ae.textContent = pos.acc>60 ? ('GPS 오차 약 '+Math.round(pos.acc)+'m — 위치가 부정확합니다. 폰에서 열어주세요')
                                : ('GPS 오차 약 '+Math.round(pos.acc)+'m');
    if(DEBUG){
      var dh='<div class="toast" style="text-align:left;font-family:var(--f-mono);font-size:11px">'+
        '<b>진단</b> 표본 '+FIX.length+' · 평활오차 '+Math.round(cp.acc)+'m · 보정 '+(G.cal?'있음':'없음')+'<br>';
      for(var z=0;z<rk.length;z++)
        dh+= (rk[z].i===w.to?'▶ ':'&nbsp;&nbsp; ')+rk[z].i+' '+SPOTS[rk[z].i].name+' : '+Math.round(rk[z].d)+'m (r'+SPOTS[rk[z].i].r+')<br>';
      dh+='2등과 차이 '+Math.round(lead)+'m · 연속 '+(G.nearHit||0)+'/3</div>';
      ae.insertAdjacentHTML('afterend', '<div id="dbg">'+dh+'</div>');
      var old2=document.getElementById('dbg'); if(old2 && old2.nextElementSibling && old2.nextElementSibling.id==='dbg') old2.remove();
    }
    drawMap();
    /* (가) 반경 안에 확실히 들어옴 */
    if(d<=sp.r){ return arriveNow(); }
    /* (나) 목표가 가장 가깝고, 2등과 충분히 벌어지고, 여유 반경 안 */
    var lead = (rk[1] ? rk[1].d - rk[0].d : 99);
    if(rk[0].i===w.to && d<=sp.r*2.5 && lead>=8 && FIX.length>=4){
      G.nearHit=(G.nearHit||0)+1;
      if(G.nearHit>=3){ G.nearHit=0; return arriveNow(); }
    } else { G.nearHit=0; }
  } else {
    de.innerHTML='<b style="font-size:14px">위치를 찾는 중…</b>';
    ae.textContent = GHOST?'유령 모드':'하늘이 트인 곳에서 더 잘 잡힙니다';
  }
  var el=Date.now()-walkStart;
  if(w.mid && !midShown && el>50000){ midShown=true; showMid(w.mid); return; }
  var ab=document.getElementById('arrivebox');
  /* 반경이 좁아 GPS만으로는 못 닿는 경우가 많다. 백업을 일찍 연다 */
  var near = (d!==null && d<=60);
  var rough = (pos && pos.acc > sp.r);
  if(ab && !ab.innerHTML && (el>15000 || GHOST || (near && rough && el>6000))){
    ab.innerHTML='<button class="btn ghost sm" id="bk">여기 도착했습니다</button>'+
      '<p class="small" style="text-align:center;margin-top:6px">안내한 자리에 서 계시면 눌러주세요</p>';
    document.getElementById('bk').onclick=arriveNow;
  }
  setTimeout(tickWalk, 1200);
}
function showMid(txt){
  html('<p class="recall serif">'+txt+'</p><p class="tapHint">화면을 누르면 계속됩니다</p>', true);
  tapNext(function(){ if(G.remote){ arriveNow(); } else { scrWalk(); } });
}
function arriveNow(){
  FIX=[]; if(G) G.nearHit=0;
  if(!G || G.phase!=='walk') return;
  G.phase='arrive'; save(); route();
}
function scrArrive(){
  var sp=SPOTS[WALK[G.wi].to];
  html('<p class="see serif">'+sp.name+'에 도착했습니다.</p><button class="btn" id="n">멈춰 서기</button>');
  document.getElementById('n').onclick=function(){ G.phase='chapter'; G.bi=0; G.ri=0; save(); route(); };
}

function endKey(){
  if(G.V<=60) return G.sok>=12?'B2':'B1';
  if(G.sign || G.R>=75) return G.sok>=12?'A2':'A1';
  return G.sok>=12?'C2':'C1';
}
function scrEnding(){
  var e=ENDINGS[endKey()];
  var step=G.ei||0;
  if(step===0){
    var h='<p class="mid" style="margin-top:80px;text-align:center">전화가 온다</p>';
    h+='<p class="see serif" style="margin:20px 0 40px">파프리 공인중개사</p>';
    h+='<p class="say" style="text-align:center">"사장님, 저예요.\n다 들어왔어요, 오늘 뭐라고 하고 다니셨는지.\n골목이 좁아서 그래요."</p>';
    h+='<p class="tapHint">화면을 누르면 계속됩니다</p>';
    html(h);
  }
  else if(step===1){
    var h='<p class="small" style="margin-top:24px">오늘 당신이 한 말</p>';
    for(var i=0;i<G.log.length;i++) h+='<p class="mid" style="margin:5px 0">'+G.log[i]+'</p>';
    h+='<p class="say" style="margin-top:22px">"세어보니까 사장님, 오늘 '+G.log.length+'번 말씀하셨네요.\n그중에 '+G.sok+'번은 처음 하시는 말이었어요.\n\n삼십 년 만에요."</p>';
    h+='<p class="tapHint">화면을 누르면 계속됩니다</p>';
    html(h);
  }
  else if(step===2){
    var h='<h1 style="margin-top:40px">'+e.t+'</h1>';
    h+='<p class="recall serif" style="margin-top:20px">'+e.b+'</p>';
    h+='<p class="mid" style="margin-top:14px">'+e.g+'<br>'+e.l+'</p>';
    h+='<p class="small" style="margin-top:16px">재개발 열기 '+G.R+'% · 감정가 '+(G.V/10).toFixed(1)+'억</p>';
    h+='<p class="tapHint">화면을 누르면 계속됩니다</p>';
    html(h);
  }
  else if(step===3){
    var h='<p class="see serif" style="margin-top:120px">"사장님, 고개 한번 들어보세요.\n\n지금 그 건물 밑에 계시죠."</p>';
    h+='<p class="tapHint">화면을 누르면 계속됩니다</p>';
    html(h, true);
  }
  else {
    try{ var a=new Audio('audio/ending.mp3'); a.volume=0.8; a.play().catch(function(){}); }catch(err){}
    var h='<p class="see serif" style="margin:110px 0 70px">이 이야기는 지어낸 것입니다.\n\n그런데 저 초록 띠는,\n정말 길을 따라 기울어 있습니다.</p>';
    h+='<button class="btn ghost" id="again">다시 걷는다</button>';
    h+='<p class="small" style="margin-top:30px;text-align:center">이 게임은 파프리 워크숍에서 만들어졌습니다.<br>파프리 공인중개사는 실재하지 않습니다.</p>';
    html(h, true);
    localStorage.removeItem('im_save');
    document.getElementById('again').onclick=function(){ G=newGame(); band(); scrTitle(); };
    return;
  }
  tapNext(function(){ G.ei=step+1; save(); route(); });
}

/* ===== 좌표 수집 ===== */
function drawSurvey(){
  if(!SURVEY) return;
  var st=JSON.parse(localStorage.getItem('im_survey')||'{}');
  var h='<h1 style="font-size:22px">좌표 수집</h1>';
  h+='<p class="small">'+VERSION+'</p>';
  h+='<p class="mid">각 지점에 <b>실제로 서서</b> [재기]를 누르세요. 30초 동안 여러 번 재서 평균을 냅니다.<br>표본이 <b>10개 이상</b> 모여야 믿을 만합니다. 3개 미만이면 다시 하라고 알려드립니다.<br>지점끼리는 <b>최소 40m</b> 떨어져야 게임이 구분할 수 있습니다.</p>';
  h+='<p class="mid" id="now">'+(pos?('현재 '+pos.lat.toFixed(6)+', '+pos.lng.toFixed(6)+' · 오차 '+Math.round(pos.acc)+'m'):'위치를 찾는 중…')+'</p>';
  for(var i=0;i<SPOTS.length;i++){
    var s=st[i];
    var lbl='미수집', qc='';
    if(s){ qc = s.acc<=10?'좋음':(s.acc<=20?'보통':'나쁨');
      lbl = s.lat.toFixed(6)+', '+s.lng.toFixed(6)+'<br>오차 '+Math.round(s.acc)+'m · '+(s.n||1)+'회 평균 · '+qc; }
    h+='<div class="srow"><button data-i="'+i+'">'+i+'. '+SPOTS[i].name+(s?' 다시':' 재기')+'</button>'+
       '<span>'+lbl+'</span></div>';
  }
  var code='var SPOTS = [\n';
  for(var j=0;j<SPOTS.length;j++){ var q=st[j];
    var rr = q ? Math.max(25, Math.round((q.acc+12)/5)*5) : SPOTS[j].r;
    code+='  {id:'+j+', name:"'+SPOTS[j].name+'", lat:'+(q?q.lat.toFixed(6):SPOTS[j].lat)+', lng:'+(q?q.lng.toFixed(6):SPOTS[j].lng)+', r:'+rr+'}'+(j<SPOTS.length-1?',':'')+'\n'; }
  code+='];';
  /* 지점끼리 너무 가까우면 경고 */
  var warn=[];
  for(var a=0;a<SPOTS.length;a++) for(var b2=a+1;b2<SPOTS.length;b2++){
    if(!st[a]||!st[b2]) continue;
    var R=6371000, p1=st[a].lat*Math.PI/180, p2=st[b2].lat*Math.PI/180;
    var dp=(st[b2].lat-st[a].lat)*Math.PI/180, dl=(st[b2].lng-st[a].lng)*Math.PI/180;
    var A=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
    var d=R*2*Math.atan2(Math.sqrt(A),Math.sqrt(1-A));
    if(d < 40) warn.push(a+'번과 '+b2+'번이 '+Math.round(d)+'m'+(d<20?' ← 못 씀':''));
  }
  if(warn.length) h+='<div class="toast"><b>지점이 너무 가깝습니다</b><br>'+warn.join('<br>')+'<br>40m 이상 떨어져야 합니다. 지점에 실제로 가서 다시 재세요.</div>';
  h+='<textarea id="code" readonly>'+code+'</textarea>';
  h+='<button class="btn sm" id="cp">코드 복사</button>';
  h+='<button class="btn ghost sm" id="apply">이 좌표로 바로 플레이</button>';
  h+='<p class="small" style="margin-top:22px">현장에 못 갔을 때: 지금 있는 곳 주변에 지점 6개를 임시로 흩어놓습니다.</p>';
  h+='<button class="btn sm" id="mock">여기 기준으로 테스트 코스 만들기</button>';
  h+='<button class="btn ghost sm" id="clr">수집 초기화</button>';
  html(h);
  var bs=scr.querySelectorAll('.srow button');
  for(var k=0;k<bs.length;k++) bs[k].onclick=function(){
    if(window.__measuring) return;
    var idx=this.getAttribute('data-i'), btn=this, secs=30;
    SMP=[]; SMPlast=0; window.__measuring=true;
    pokeGPS();
    var nowEl=document.getElementById('now');
    var poke=setInterval(pokeGPS, 1500);
    var t=setInterval(function(){
      secs--;
      btn.textContent='재는 중 '+secs+'초 · '+SMP.length+'개';
      if(nowEl) nowEl.innerHTML='그 자리에 가만히 서 계세요<br>현재 오차 '+(pos?Math.round(pos.acc):'?')+'m · 모인 표본 '+SMP.length+'개';
      if(secs>0) return;
      clearInterval(t); clearInterval(poke); window.__measuring=false;
      var samples=SMP.slice();
      if(samples.length<3){
        alert('표본이 '+samples.length+'개밖에 안 모였습니다.\n하늘이 트인 쪽으로 두세 걸음 옮겨서 다시 해보세요.');
        drawSurvey(); return;
      }
      samples.sort(function(a,b){return a.acc-b.acc;});
      var use=samples.slice(0, Math.max(3, Math.ceil(samples.length*0.6)));
      var ws=0, la=0, ln=0;
      for(var q=0;q<use.length;q++){ var w=1/(use[q].acc*use[q].acc); ws+=w; la+=use[q].lat*w; ln+=use[q].lng*w; }
      var eff=Math.max(3, use[0].acc/Math.sqrt(use.length));
      var res={lat:la/ws, lng:ln/ws, acc:eff, n:use.length};
      var st2=JSON.parse(localStorage.getItem('im_survey')||'{}');
      /* 다른 지점과 좌표가 똑같으면 캐시값이다. 거부 */
      var clash=-1;
      for(var z in st2){ if(z!==idx && st2[z] &&
        Math.abs(st2[z].lat-res.lat)<0.000012 && Math.abs(st2[z].lng-res.lng)<0.000012){ clash=z; break; } }
      if(clash>-1){
        alert(clash+'번과 좌표가 똑같이 나왔습니다.\n위치가 아직 갱신되지 않은 것 같습니다.\n30초쯤 기다렸다가 다시 눌러주세요.');
        drawSurvey(); return;
      }
      var prev=st2[idx];
      if(!prev || res.acc<prev.acc){ st2[idx]=res; localStorage.setItem('im_survey',JSON.stringify(st2)); }
      else { alert('이전 측정('+Math.round(prev.acc)+'m)이 더 좋아서 그대로 둡니다.'); }
      drawSurvey();
    },1000);
  };
  document.getElementById('cp').onclick=function(){
    var t=document.getElementById('code'); t.select(); t.setSelectionRange(0,99999);
    try{document.execCommand('copy');}catch(e){}
    if(navigator.clipboard) navigator.clipboard.writeText(t.value);
    this.textContent='복사됨';
  };
  document.getElementById('apply').onclick=function(){
    var st3=JSON.parse(localStorage.getItem('im_survey')||'{}');
    for(var m=0;m<SPOTS.length;m++){ if(st3[m]){ SPOTS[m].lat=st3[m].lat; SPOTS[m].lng=st3[m].lng;
      SPOTS[m].r=Math.max(25, Math.round((st3[m].acc+12)/5)*5); } }
    localStorage.setItem('im_spots', JSON.stringify(SPOTS)); localStorage.setItem('im_spots_v', VERSION);
    location.href = location.pathname;
  };
  document.getElementById('mock').onclick=function(){
    if(!pos){ alert('아직 위치를 못 잡았습니다. 하늘이 트인 곳에서 잠시 기다려 주세요.'); return; }
    var mLat=1/111320, mLng=1/(111320*Math.cos(pos.lat*Math.PI/180));
    var off=[[0,0],[0,-90],[0,-190],[110,-120],[-120,-60],[40,-140]];
    for(var i2=0;i2<6;i2++){
      SPOTS[i2].lat = pos.lat + off[i2][0]*mLat;
      SPOTS[i2].lng = pos.lng + off[i2][1]*mLng;
      SPOTS[i2].r = 20;
    }
    localStorage.setItem('im_spots', JSON.stringify(SPOTS)); localStorage.setItem('im_spots_v', VERSION);
    localStorage.removeItem('im_save');
    location.href = location.pathname;
  };
  document.getElementById('clr').onclick=function(){ localStorage.removeItem('im_survey'); localStorage.removeItem('im_spots'); localStorage.removeItem('im_spots_v'); location.href=location.pathname+'?survey=1'; };
}

/* ===== 시작 ===== */
if(SURVEY){ startGPS(); drawSurvey(); }
else { scrTitle(); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden) wake(); });
</script>
</body>
